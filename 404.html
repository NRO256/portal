<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | NRO256 portal</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-block-size: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background-color: #f6f4ef;
      color: #1c1a17;
      font-family:
        "BIZ UDPGothic", "BIZ UDPゴシック", "Yu Gothic UI", "Hiragino Kaku Gothic ProN",
        "Meiryo", system-ui, -apple-system, sans-serif;
      font-size: 0.9375rem;
      line-height: 1.65;
    }

    main {
      inline-size: min(100%, 540px);
      padding: clamp(24px, 5vw, 40px);
      background-color: #fcfbf8;
      border: 1px solid rgba(28, 26, 23, 0.22);
      border-radius: 12px;
    }

    .code {
      margin: 0 0 12px;
      font-family: "BIZ UDGothic", "BIZ UDゴシック", "Consolas", ui-monospace, monospace;
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      color: #69635a;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.375rem, 3vw, 1.75rem);
      font-weight: 500;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: #1c1a17;
    }

    p {
      margin: 0 0 24px;
      color: #524d45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .btn {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      min-block-size: 44px;
      padding: 8px 20px;
      border-radius: 8px;
      border: 1px solid #1b4d7e;
      background-color: #1b4d7e;
      color: #fcfbf8;
      font-size: 0.9375rem;
      font-weight: 500;
      line-height: 1.2;
      text-decoration: none;
      transition:
        background-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
        border-color 150ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn:hover {
      background-color: #143b61;
      border-color: #143b61;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      min-block-size: 44px;
      padding: 0 4px;
      color: #524d45;
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: rgba(28, 26, 23, 0.22);
      text-underline-offset: 4px;
      transition:
        color 150ms cubic-bezier(0.22, 1, 0.36, 1),
        text-decoration-color 150ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .text-link:hover {
      color: #1b4d7e;
      text-decoration-color: #1b4d7e;
    }

    .btn:focus-visible,
    .text-link:focus-visible {
      outline: 2px solid #1b4d7e;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404 Not Found</p>
    <h1>お探しのページが見つかりません</h1>
    <p>
      URLが変更されたか、存在しないアドレスにアクセスされた可能性があります。NRO256 portal のトップページへお戻りください。
    </p>
    <div class="actions">
      <a class="btn" href="/portal/">トップページへ戻る</a>
      <a class="text-link" href="https://github.com/NRO256" target="_blank" rel="noopener noreferrer">GitHub プロフィール（新しいタブで開く）</a>
    </div>
  </main>
</body>
</html>
